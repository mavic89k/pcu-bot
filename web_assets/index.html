<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#162d23">
  <meta name="description" content="배재대학교 오늘과 다음 주 학식, 최신 공지와 공지 제목 검색">
  <title>배재대 알리미</title>
  <link rel="stylesheet" href="/web/app.css?v=4.5.1">
  <script src="/web/app.js?v=4.5.1" defer></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <header class="masthead">
    <div class="shell navigation">
      <a class="brand" href="/web"><span class="brand-mark" aria-hidden="true">P</span> 배재대 알리미</a>
      <a class="channel" href="https://pf.kakao.com/_hIeGX">카카오톡 <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main id="main" class="shell">
    <div class="sections">
      <section id="meals" class="panel" tabindex="-1" aria-labelledby="meals-title">
        <div class="panel-heading">
          <h1 id="meals-title">오늘의 학식</h1>
          <div class="week-tabs" role="group" aria-label="조회할 주">
            <button type="button" data-week="current" aria-pressed="true">이번 주</button>
            <button type="button" data-week="next" aria-pressed="false">다음 주</button>
          </div>
        </div>
        <p id="meal-period" class="panel-subtitle" aria-live="polite">한국 시간 기준</p>
        <div class="meal-days" id="meal-days" role="group" aria-label="조회할 날짜"></div>
        <div class="meal-content" id="meal-content" aria-live="polite">
          <p class="empty">학교 홈페이지에서 식단을 불러오는 중입니다.</p>
        </div>
      </section>

      <section id="notices" class="panel" tabindex="-1" aria-labelledby="notices-title">
        <div class="panel-heading"><h2 id="notices-title">학교 공지</h2></div>
        <p class="panel-subtitle">학사 · 일반 · 생활관</p>
        <form id="notice-form" class="search-form" role="search">
          <label class="sr-only" for="notice-query">공지 제목 검색어</label>
          <input id="notice-query" name="q" type="search" required maxlength="60" placeholder="공지 제목 검색 · 예: 장학금">
          <button type="submit">검색</button>
        </form>
        <div class="board-tabs" id="board-tabs" role="group" aria-label="공지 게시판"></div>
        <div id="notice-results" aria-live="polite">
          <p class="empty">학교 홈페이지에서 공지를 불러오는 중입니다.</p>
        </div>
      </section>
    </div>
    <noscript><p class="empty">학식과 공지를 조회하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
  </main>
  <footer class="shell footer">
    <p>배재대 알리미 <span>비공식 학생 편의 서비스</span></p>
    <div><a href="https://www.pcu.ac.kr/">배재대학교 ↗</a><a href="https://stats.uptimerobot.com/aoBQJ1uTFV">서버 상태 ↗</a></div>
  </footer>
</body>
</html>
