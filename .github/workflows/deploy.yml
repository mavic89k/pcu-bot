name: Deploy to cloudtype
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: baeminhyuk0809/bot
          stage: main
          yaml: |
            name: pcu-chatbot
            app: python@3.12
            options:
              ports: "5000"
              start: python main.py
              install: pip install -r requirements.txt
              env:
                - name: FIREBASE_DB_URL
                  secret: FIREBASE_DB_URL
                - name: FIREBASE_SECRET
                  secret: FIREBASE_SECRET
                - name: NOTIFIER_TELEGRAM_TOKEN
                  secret: NOTIFIER_TELEGRAM_TOKEN
                - name: CHAT_ID
                  secret: CHAT_ID
              buildenv: []
            context:
              git:
                url: https://github.com/${{ github.repository }}.git
                ref: ${{ github.ref }}
